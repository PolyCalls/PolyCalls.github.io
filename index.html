<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolyCalls — Prediction Market Tracker</title>
<meta name="description" content="Real-time Polymarket prediction market calls. Full transparency. Every win. Every loss.">
<script src="data/dashboard_data.js"></script>
<style>
  :root {
    --blue:        #3B6FEF;
    --blue-dark:   #1A3FBF;
    --blue-pale:   #EEF3FE;
    --blue-border: #C7D7F8;
    --green:       #15803D;
    --green-bg:    #F0FDF4;
    --green-bd:    #BBF7D0;
    --red:         #B91C1C;
    --red-bg:      #FEF2F2;
    --red-bd:      #FECACA;
    --amber:       #92400E;
    --amber-bg:    #FFFBEB;
    --amber-bd:    #FDE68A;
    --bg:          #F4F6FA;
    --surface:     #FFFFFF;
    --surface2:    #F1F5FB;
    --border:      #E2E8F4;
    --border-mid:  #CBD5E8;
    --text:        #0F172A;
    --text2:       #374151;
    --muted:       #6B7280;
    --muted2:      #9CA3AF;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
    font-size: 13px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ── LAYOUT: fixed 100vh grid ── */
  .app {
    display: grid;
    grid-template-rows: 52px 72px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ── TOPBAR ── */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; }
  /* Use the banner (wordmark) image as the logo — crop to show just the relevant part */
  .nav-wordmark-img {
    height: 28px;
    width: auto;
    object-fit: cover;
    object-position: left center;
    display: block;
  }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .live-pill {
    display: flex; align-items: center; gap: 5px;
    background: var(--green-bg); border: 1px solid var(--green-bd);
    color: var(--green); border-radius: 20px;
    padding: 3px 10px; font-size: 11px; font-weight: 700;
  }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  .last-up { font-size: 11px; color: var(--muted2); }
  .btn-ref {
    height: 28px; padding: 0 12px;
    border: 1px solid var(--border-mid); border-radius: 6px;
    background: var(--surface); color: var(--text2);
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all .12s;
  }
  .btn-ref:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-pale); }

  /* ── STATS BAR ── */
  .stats-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 0;
    flex-shrink: 0;
  }
  .stat-main {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-right: 28px;
    border-right: 1px solid var(--border);
    flex-shrink: 0;
  }
  .wr-num {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: -1.5px;
    line-height: 1;
  }
  .wr-num.perfect { color: var(--green); }
  .wr-num.great   { color: #16A34A; }
  .wr-num.ok      { color: var(--amber); }
  .wr-num.bad     { color: var(--red); }
  .wr-lbl { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing:.5px; margin-top:3px; }
  .streak-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 7px;
    font-size: 12px; font-weight: 700;
    background: var(--green-bg); border: 1px solid var(--green-bd); color: var(--green);
  }
  .streak-pill.loss { background: var(--red-bg); border-color: var(--red-bd); color: var(--red); }
  .streak-pill.neu  { background: var(--surface2); border-color: var(--border); color: var(--muted); }

  .stat-cells { display: flex; flex: 1; }
  .sc {
    flex: 1; text-align: center; padding: 0 12px;
    border-right: 1px solid var(--border);
  }
  .sc:last-child { border-right: none; }
  .sc-val { font-size: 24px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
  .sc-val.g { color: var(--green); }
  .sc-val.r { color: var(--red); }
  .sc-val.a { color: var(--amber); }
  .sc-val.b { color: var(--blue); }
  .sc-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing:.5px; font-weight:600; margin-top:3px; }

  /* ── BODY: 3-column grid ── */
  .body {
    display: grid;
    grid-template-columns: 280px 1fr 180px;
    gap: 0;
    overflow: hidden;
    min-height: 0;
  }

  /* ── COLUMN PANEL ── */
  .col {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
    min-height: 0;
  }
  .col:last-child { border-right: none; }

  .col-head {
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
    background: var(--surface2);
  }
  .col-title {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .8px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .cpill {
    background: var(--blue-pale); color: var(--blue);
    font-size: 10px; font-weight: 700;
    padding: 1px 6px; border-radius: 20px;
    text-transform: none; letter-spacing: 0;
  }

  .col-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--bg);
    min-height: 0;
  }
  .col-body::-webkit-scrollbar { width: 4px; }
  .col-body::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 4px; }

  /* ── OPEN CALLS (left col) ── */
  .open-card {
    margin: 8px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    border-top: 3px solid var(--blue);
    padding: 10px 12px;
    transition: box-shadow .12s;
  }
  .open-card:hover { box-shadow: 0 2px 8px rgba(59,111,239,.1); }
  .oc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
  .oc-q { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.35; flex: 1; }
  .dir-chip {
    display: inline-flex; align-items: center;
    padding: 2px 7px; border-radius: 5px;
    font-size: 10px; font-weight: 700; white-space: nowrap; flex-shrink: 0;
  }
  .cy { background: var(--blue-pale); color: var(--blue); }
  .cn { background: var(--surface2); color: var(--muted); }
  .cu { background: var(--green-bg); color: var(--green); }
  .cd { background: var(--red-bg); color: var(--red); }

  .oc-foot { display: flex; justify-content: space-between; align-items: flex-end; }
  .oc-prob { font-size: 18px; font-weight: 800; color: var(--blue); letter-spacing: -.5px; line-height: 1; }
  .oc-prob-lbl { font-size: 9px; color: var(--muted); margin-top: 1px; }
  .watching-tag {
    display: inline-block;
    background: var(--amber-bg); border: 1px solid var(--amber-bd);
    color: var(--amber); font-size: 9px; font-weight: 700;
    padding: 1px 7px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: .3px;
  }
  .oc-date { font-size: 10px; color: var(--muted2); margin-top: 2px; text-align: right; }

  /* ── CALLS FEED (center col) ── */
  .feed-filters {
    display: flex; gap: 5px; padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .fb {
    height: 24px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: 5px;
    background: var(--surface); color: var(--muted);
    font-size: 11px; font-weight: 600; cursor: pointer;
    transition: all .12s;
  }
  .fb:hover { border-color: var(--blue); color: var(--blue); }
  .fb.active { background: var(--blue); border-color: var(--blue); color: #fff; }

  .feed-table { width: 100%; border-collapse: collapse; }
  .feed-table thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--surface2);
    text-align: left; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .feed-table tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .1s; cursor: pointer;
  }
  .feed-table tbody tr:hover { background: var(--blue-pale); }
  .feed-table td { padding: 8px 12px; vertical-align: middle; }

  .sbadge {
    display: inline-flex; align-items: center;
    padding: 2px 8px; border-radius: 5px;
    font-size: 10px; font-weight: 700; white-space: nowrap;
  }
  .sw { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bd); }
  .sl { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-bd); }
  .sp { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-bd); }

  .tq { max-width: 220px; }
  .tq-text { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tq-out  { font-size: 10px; color: var(--green); font-weight: 600; margin-top: 1px; }
  .tp { font-size: 13px; font-weight: 700; color: var(--text2); }
  .td { font-size: 11px; color: var(--muted2); white-space: nowrap; }

  /* ── BREAKDOWN (right col) ── */
  .bk-card {
    margin: 8px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 12px;
  }
  .bk-cat  { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing:.5px; color: var(--muted); margin-bottom:4px; }
  .bk-wr   { font-size: 22px; font-weight: 900; letter-spacing:-1px; line-height:1; margin-bottom:3px; }
  .bk-det  { font-size: 10px; color: var(--muted2); }

  /* ── FOOTER ── */
  .footer-bar {
    grid-column: 1/-1;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 6px 24px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10px; color: var(--muted2);
    flex-shrink: 0;
  }
  .footer-bar a { color: var(--blue); text-decoration: none; }
  .footer-logo { height: 16px; width: auto; vertical-align: middle; margin-right: 6px; opacity: .5; }

  .empty { padding: 24px 16px; text-align: center; color: var(--muted2); font-size: 12px; }
  .err { margin: 8px 10px; background: var(--red-bg); border: 1px solid var(--red-bd); color: var(--red); padding: 8px 12px; border-radius: 8px; font-size: 12px; }
</style>
</head>

<script>
let allData = [];
let currentFilter = "ALL";

async function loadData() {
  if (window.DASHBOARD_DATA && window.DASHBOARD_DATA.length > 0) {
    allData = window.DASHBOARD_DATA;
    document.getElementById("last-up").textContent = "Updated " + new Date().toLocaleTimeString();
    render(); return;
  }
  try {
    const r = await fetch("data/calls_resolved.json?" + Date.now());
    if (!r.ok) throw new Error();
    allData = await r.json();
    document.getElementById("last-up").textContent = "Updated " + new Date().toLocaleTimeString();
    render();
  } catch {
    document.getElementById("center-col").innerHTML = '<div class="err">No data yet. Run the pipeline then refresh.</div>';
  }
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll(".fb").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderCenter();
}

function fmtDate(iso) {
  if (!iso) return "—";
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  } catch { return iso.slice(0,10); }
}

function chip(dir) {
  const d = (dir||"").toUpperCase();
  if (d==="YES")  return '<span class="dir-chip cy">YES</span>';
  if (d==="NO")   return '<span class="dir-chip cn">NO</span>';
  if (d==="UP")   return '<span class="dir-chip cu">↑ UP</span>';
  if (d==="DOWN") return '<span class="dir-chip cd">↓ DOWN</span>';
  return '<span class="dir-chip cn">' + d + '</span>';
}

function streak(data) {
  const s = data.filter(r => r.resolution_status==="WIN"||r.resolution_status==="LOSS")
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  if (!s.length) return {n:0,t:null};
  const t = s[0].resolution_status; let n = 0;
  for (const r of s) { if (r.resolution_status===t) n++; else break; }
  return {n, t};
}

function render() {
  const wins    = allData.filter(r=>r.resolution_status==="WIN").length;
  const losses  = allData.filter(r=>r.resolution_status==="LOSS").length;
  const pending = allData.filter(r=>r.resolution_status==="PENDING").length;
  const settled = wins + losses;
  const wr      = settled > 0 ? wins/settled*100 : null;

  const wrEl = document.getElementById("wr-num");
  wrEl.textContent = wr !== null ? wr.toFixed(1)+"%" : "—";
  wrEl.className = "wr-num " + (wr===null?"": wr===100?"perfect": wr>=65?"great": wr>=45?"ok":"bad");

  const st = streak(allData);
  const pill = document.getElementById("streak-pill");
  const emoji = document.getElementById("streak-emoji");
  const txt   = document.getElementById("streak-txt");
  if (st.n >= 2 && st.t==="WIN")  { pill.className="streak-pill"; emoji.textContent="🔥"; txt.textContent=st.n+"-Win Streak"; }
  else if (st.n>=2&&st.t==="LOSS"){ pill.className="streak-pill loss"; emoji.textContent="❄️"; txt.textContent=st.n+"-Loss Streak"; }
  else if (st.n===1&&st.t==="WIN"){ pill.className="streak-pill"; emoji.textContent="✅"; txt.textContent="Last Call: WIN"; }
  else { pill.className="streak-pill neu"; emoji.textContent="📊"; txt.textContent=settled>0?wins+" of "+settled+" settled":"Building track record"; }

  document.getElementById("sv-wins").textContent    = wins;
  document.getElementById("sv-losses").textContent  = losses;
  document.getElementById("sv-pending").textContent = pending;
  document.getElementById("sv-total").textContent   = allData.length;
  document.getElementById("sv-settled").textContent = settled;

  renderOpenCalls();
  renderCenter();
  renderBreakdown();
}

function renderOpenCalls() {
  const open = allData.filter(r=>r.resolution_status==="PENDING")
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  document.getElementById("open-count").textContent = open.length;
  const col = document.getElementById("open-col");
  if (!open.length) { col.innerHTML='<div class="empty">No open calls right now.</div>'; return; }
  col.innerHTML = open.map(r => {
    const yp = r.yes_price!=null ? (r.yes_price*100).toFixed(1)+"%" : "—";
    const url = r.polymarket_url || "https://polymarket.com/markets";
    return `<div class="open-card" onclick="window.open('${url}','_blank')" style="cursor:pointer" title="View on Polymarket">
      <div class="oc-top">
        <div class="oc-q">${r.question||"—"}</div>
        ${chip(r.called_direction)}
      </div>
      <div class="oc-foot">
        <div>
          <div class="oc-prob">${yp}</div>
          <div class="oc-prob-lbl">YES price</div>
        </div>
        <div>
          <div class="watching-tag">Watching</div>
          <div class="oc-date">${fmtDate(r.date)}</div>
        </div>
      </div>
    </div>`;
  }).join("");
}

function renderCenter() {
  const data = allData.filter(r => {
    if (currentFilter==="ALL") return true;
    return (r.resolution_status||"").toUpperCase()===currentFilter;
  }).sort((a,b)=>new Date(b.date)-new Date(a.date));

  const col = document.getElementById("center-col");
  if (!data.length) { col.innerHTML='<div class="empty">No calls match this filter.</div>'; return; }

  const rows = data.map(r => {
    const yp = r.yes_price!=null ? (r.yes_price*100).toFixed(1)+"%" : "—";
    const s  = (r.resolution_status||"").toUpperCase();
    const badge = s==="WIN" ? '<span class="sbadge sw">Win</span>'
                : s==="LOSS"? '<span class="sbadge sl">Loss</span>'
                :             '<span class="sbadge sp">Pending</span>';
    const outcome = r.resolved_outcome ? `<div class="tq-out">→ ${r.resolved_outcome}</div>` : "";
    const url = r.polymarket_url || "https://polymarket.com/markets";
    return `<tr onclick="window.open('${url}','_blank')" title="View on Polymarket">
      <td>${badge}</td>
      <td>${chip(r.called_direction)}</td>
      <td class="tq"><div class="tq-text" title="${(r.question||"").replace(/"/g,"&quot;")}">${r.question||"—"}</div>${outcome}</td>
      <td class="tp">${yp}</td>
      <td class="td">${fmtDate(r.date)}</td>
    </tr>`;
  }).join("");

  col.innerHTML = `<table class="feed-table">
    <thead><tr><th>Result</th><th>Call</th><th>Market</th><th>Price</th><th>Date</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderBreakdown() {
  const cats = {};
  for (const r of allData) {
    const c = r.category||"Other";
    if (!cats[c]) cats[c]={w:0,l:0,p:0};
    if (r.resolution_status==="WIN")          cats[c].w++;
    else if (r.resolution_status==="LOSS")    cats[c].l++;
    else if (r.resolution_status==="PENDING") cats[c].p++;
  }
  const col = document.getElementById("right-col");
  const entries = Object.entries(cats);
  if (!entries.length) { col.innerHTML='<div class="empty">—</div>'; return; }
  col.innerHTML = entries.map(([name,d]) => {
    const s = d.w+d.l;
    const wr = s>0 ? (d.w/s*100).toFixed(0)+"%" : "N/A";
    const color = s===0?"var(--muted)": d.w/s>=.6?"var(--green)": d.w/s>=.4?"var(--amber)":"var(--red)";
    return `<div class="bk-card">
      <div class="bk-cat">${name}</div>
      <div class="bk-wr" style="color:${color}">${wr}</div>
      <div class="bk-det">${d.w}W &middot; ${d.l}L &middot; ${d.p} open</div>
    </div>`;
  }).join("");
}

loadData();
</script>
</body>
